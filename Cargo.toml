[workspace]
members = [
    "crates/core",
    "crates/providers",
    "crates/net",
    "crates/plugins",
    "crates/daemon",
    "crates/backup",
    "crates/remote",
    "crates/scripting",
    "tools/modalx",
    "crates/cli",
    "crates/installer",
    "crates/ui",
]
default-members = ["crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["OguzhanUmutlu"]
license = "MIT"
description = "High-performance, industry-grade Minecraft server setup and management CLI tool & daemon."
repository = "https://github.com/OguzhanUmutlu/craft"

[workspace.dependencies]
# Workspace crates
craft-core = { path = "crates/core" }
craft-providers = { path = "crates/providers" }
craft-net = { path = "crates/net" }
craft-plugins = { path = "crates/plugins" }
craft-daemon = { path = "crates/daemon" }
craft-backup = { path = "crates/backup" }
craft-remote = { path = "crates/remote" }
craft-scripting = { path = "crates/scripting" }
modalx = { path = "tools/modalx" }
craft-cli = { package = "craft", path = "crates/cli" }

# Serialization & data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Async & Networking
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

# CLI & Terminal UI
clap = { version = "4.5", features = ["derive", "env"] }
colored = "3.0"
indicatif = "0.17"
comfy-table = "7.1"
dialoguer = "0.11"
crossterm = "0.29"

# Diagnostics & Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"

# Filesystem & OS
directories = "5.0"
fs2 = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.0"
sysinfo = "0.33"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
sha2 = "0.10"
hex = "0.4"
tempfile = "3.16"
bytes = "1.10"
zstd = "0.13"
mlua = { version = "0.12", default-features = false, features = ["lua54", "vendored", "serialize", "send"] }

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
debug = 1
incremental = false

[profile.test.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
