[software]
id = "tshock"
name = "TShock (Terraria)"
display_name = "TShock for Terraria"
game = "terraria"
edition = "native"
description = "TShock for Terraria"
author = "Pryaxis"
version = "1.0.0"

[capabilities]
plugins = true
mods = false
datapacks = false
rcon = false

[runtime]
kind = "native"
default_server_file = "TerrariaServer.bin.x86_64"
arguments = ["-config", "serverconfig.txt"]
stop_method = "stdin"
stop_command = "exit\n"
stop_timeout_seconds = 10

[network]
default_port = 7777
protocol = "tcp"

[versions]
recommended = "v5.2.0"
bundled = ["v5.2.0", "v5.1.3"]
fetch_mode = "github_releases"
api_url = "https://api.github.com/repos/Pryaxis/TShock/releases"

[assets]
download_mode = "url_template"
url_template = "https://github.com/Pryaxis/TShock/releases/download/{version}/TShock-{version}-Server.zip"
filename = "tshock.zip"
is_archive = true

[properties]
file = "serverconfig.txt"
format = "properties"
schema_file = "properties.toml"

[plugins]
folder = "ServerPlugins"
