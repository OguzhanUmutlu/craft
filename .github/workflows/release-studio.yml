name: Release Craft Desktop Studio

on:
  push:
    tags:
      - 'studio-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. studio-v1.0.0)'
        required: true
        default: 'studio-v1.0.0'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build frontend assets
        working-directory: crates/ui
        run: |
          npm ci
          npm run build

      - name: Compile release binaries
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo build --release -p craft-ui -p craft

      - name: Package Linux release bundle
        run: |
          python3 tools/package_ui.py --skip-build --target-dir releases/dist --platform linux-amd64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: craft-studio-linux-amd64
          path: |
            releases/dist/craft-studio-linux-amd64.tar.gz
            releases/dist/craft-studio-linux-amd64.tar.gz.sha256

  build-macos:
    name: Build macOS (Apple Silicon arm64)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build frontend assets
        working-directory: crates/ui
        run: |
          npm ci
          npm run build

      - name: Compile release binaries
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo build --release -p craft-ui -p craft

      - name: Package macOS release bundle
        run: |
          python3 tools/package_ui.py --skip-build --target-dir releases/dist --platform darwin-arm64

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: craft-studio-darwin-arm64
          path: |
            releases/dist/craft-studio-darwin-arm64.tar.gz
            releases/dist/craft-studio-darwin-arm64.tar.gz.sha256

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build frontend assets
        working-directory: crates/ui
        run: |
          npm ci
          npm run build

      - name: Compile release binaries
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo build --release -p craft-ui -p craft

      - name: Package Windows release bundle
        run: |
          python tools/package_ui.py --skip-build --target-dir releases/dist --platform windows-amd64

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: craft-studio-windows-amd64
          path: |
            releases/dist/craft-studio-windows-amd64.zip
            releases/dist/craft-studio-windows-amd64.zip.sha256

  publish-release:
    name: Aggregate & Publish Release
    runs-on: ubuntu-22.04
    needs: [build-linux, build-macos, build-windows]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: releases/dist
          merge-multiple: true

      - name: Validate and generate release manifests
        id: publish_step
        run: |
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          python3 tools/publish_ui.py --stage-dir releases/dist --tag "$TAG_NAME" --dry-run
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.publish_step.outputs.tag_name }}
          name: "Craft Desktop Studio ${{ steps.publish_step.outputs.tag_name }}"
          body_path: releases/dist/release-notes-${{ steps.publish_step.outputs.tag_name }}.md
          files: |
            releases/dist/*
          draft: false
          prerelease: false
